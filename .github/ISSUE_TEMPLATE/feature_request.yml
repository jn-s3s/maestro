name: Feature request
description: Suggest an idea or improvement for Maestro
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Describe the problem you are trying to solve rather than only the solution, that helps evaluate alternatives.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Maestro to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, tools or workarounds you have tried or considered.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, mockups or links that support the request.
  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and discussions and did not find a duplicate
          required: true
