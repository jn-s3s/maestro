[workspace]
members = ["core"]

[package]
name = "maestro-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "maestro-prototype"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
maestro-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "~2.2"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
