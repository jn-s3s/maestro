[package]
name = "maestro-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "maestro-prototype"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "~2.11.6", features = ["tray-icon", "image-png"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }
